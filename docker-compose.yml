version: '3.8'

services:
  # 1. PostgreSQL Authoritative Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: ticketnest-postgres
    restart: always
    environment:
      POSTGRES_USER: ticketnest_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ticketnest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketnest_admin -d ticketnest']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Queue Broker
  redis:
    image: redis:7-alpine
    container_name: ticketnest-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. TicketNest Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketnest-app
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://ticketnest_admin:secretpassword@postgres:5432/ticketnest?schema=public'
      REDIS_URL: 'redis://redis:6379'
      RESERVATION_HOLD_MINUTES: 10
      CLEANUP_INTERVAL_SECONDS: 30
      APP_URL: 'http://localhost:3000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
